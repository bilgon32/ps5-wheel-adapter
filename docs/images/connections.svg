<title id="title">G27 Studio connection guide</title><desc id="desc">Connect the powered G27 wheel with its original pedals and shifter, a licensed PS4 specialty controller, and an optional USB load-cell pedal device to a USB hub. Connect the hub to the Pico's added host port. Connect the Pico's built-in USB port to the PC for setup or PS5 for driving.</desc>
