<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Pico USB host port wiring</title><desc id="desc">Connect added USB Type A port D plus to Pico GPIO0 physical pin 1, D minus to GPIO1 physical pin 2, VBUS 5 volts to Pico VBUS physical pin 40, and ground to Pico ground physical pin 38.</desc><rect width="1000" height="380" rx="18" fill="#111315"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="47" font-size="11" fill="#c7ef82" letter-spacing="3">G27 STUDIO / BUILD THE ADAPTER</text><text x="40" y="84" font-size="27" fill="#eef0e9">Four connections. One added USB port.</text><rect x="40" y="117" width="300" height="212" rx="10" fill="#1f2b1b" stroke="#596e46"/><rect x="660" y="117" width="300" height="212" rx="10" fill="#191c1e" stroke="#424d3a"/><text x="62" y="149" fill="#d5f3b6" font-size="13" font-weight="600">RASPBERRY PI PICO</text><text x="682" y="149" fill="#d5f3b6" font-size="13" font-weight="600">ADDED USB TYPE-A PORT</text>
<g font-size="13" fill="#b8c5ae"><text x="63" y="183">GPIO0 · physical pin 1</text><text x="63" y="221">GPIO1 · physical pin 2</text><text x="63" y="259">VBUS · physical pin 40</text><text x="63" y="297">GND · physical pin 38</text><text x="682" y="183">D+ · data positive</text><text x="682" y="221">D− · data negative</text><text x="682" y="259">VBUS · 5 V</text><text x="682" y="297">GND · ground</text></g>
<g fill="none" stroke-width="3"><path d="M340 179H660" stroke="#c7ef82"/><path d="M340 217H660" stroke="#93b9ed"/><path d="M340 255H660" stroke="#efb477"/><path d="M340 293H660" stroke="#84937a"/></g><text x="40" y="357" fill="#8a9980" font-size="11">Follow connector labels and pin numbers. Cable colors are not guaranteed. Use the wheel's normal power supply.</text></g></svg>
